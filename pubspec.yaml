name: basira
description: Arabic source-linked learning and self-assessment app.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/lessons.json
    - assets/data/books.json
    - assets/data/questions.json
    - assets/data/types.json
    - assets/data/coverage.json
  fonts:
    - family: BasiraArabic
      fonts:
        - asset: assets/fonts/BasiraArabic-400.ttf
          weight: 400
        - asset: assets/fonts/BasiraArabic-600.ttf
          weight: 600
